name: JMeter Parallel Run

on:
  workflow_dispatch:

jobs:
  build-docker:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t jmeter-demo:v1 .

  run-jmeter:
    needs: build-docker
    runs-on: self-hosted

    strategy:
      matrix:
        container_id: [1, 2, 3]

    steps:
      - name: Run JMeter Container
        run: |
          docker run --rm --name test${{ matrix.container_id }} jmeter-demo:v1
