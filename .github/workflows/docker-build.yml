name: Docker Parallel Containers

on:
  workflow_dispatch:

jobs:
  run-parallel:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t jmeter-demo:v1 .

      - name: Start Container 1
        run: docker run -d --name test1 jmeter-demo:v1

      - name: Start Container 2
        run: docker run -d --name test2 jmeter-demo:v1

      - name: Start Container 3
        run: docker run -d --name test3 jmeter-demo:v1

      - name: Show Running Containers
        run: docker ps

      - name: Stop Containers
        run: docker stop test1 test2 test3

      - name: Remove Containers
        run: docker rm test1 test2 test3
