name: Docker Test

on:
  workflow_dispatch:

jobs:
  docker-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Docker Version
        run: docker version

      - name: Build Docker Image
        run: docker build -t jmeter-demo:v1 .

      - name: Show Docker Images
        run: docker images
