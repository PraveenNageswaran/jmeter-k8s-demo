name: Docker Parallel Run

on:
  workflow_dispatch:

jobs:
  build-docker:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t jmeter-demo:v1 .

  run-test-1:
    runs-on: self-hosted
    needs: build-docker

    steps:
      - name: Run Container 1
        run: docker run --rm jmeter-demo:v1

  run-test-2:
    runs-on: self-hosted
    needs: build-docker

    steps:
      - name: Run Container 2
        run: docker run --rm jmeter-demo:v1

  run-test-3:
    runs-on: self-hosted
    needs: build-docker

    steps:
      - name: Run Container 3
        run: docker run --rm jmeter-demo:v1
