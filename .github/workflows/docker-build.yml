name: JMeter Parallel Run

on:
  workflow_dispatch:

jobs:
  run-parallel:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t jmeter-demo:v1 .

      - name: Launch 3 Parallel JMeter Containers
        shell: powershell
        run: |
          docker run -d --name jmeter-test-1 jmeter-demo:v1
          docker run -d --name jmeter-test-2 jmeter-demo:v1
          docker run -d --name jmeter-test-3 jmeter-demo:v1

      - name: Show Containers
        run: docker ps -a
