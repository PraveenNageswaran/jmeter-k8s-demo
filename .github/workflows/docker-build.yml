name: JMeter Parallel Run

on:
  workflow_dispatch:

jobs:
  run-parallel:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove Old Containers
        shell: powershell
        run: |
          docker rm -f jmeter-test-1
          docker rm -f jmeter-test-2
          docker rm -f jmeter-test-3

      - name: Build Docker Image
        run: docker build -t jmeter-demo:v1 .

      - name: Start JMeter Container 1
        run: docker run -d --name jmeter-test-1 jmeter-demo:v1

      - name: Start JMeter Container 2
        run: docker run -d --name jmeter-test-2 jmeter-demo:v1

      - name: Start JMeter Container 3
        run: docker run -d --name jmeter-test-3 jmeter-demo:v1

      - name: Wait 10 Seconds
        shell: powershell
        run: Start-Sleep -Seconds 10

      - name: Show Containers
        run: docker ps -a

      - name: Show Logs Test 1
        run: docker logs jmeter-test-1

      - name: Show Logs Test 2
        run: docker logs jmeter-test-2

      - name: Show Logs Test 3
        run: docker logs jmeter-test-3
