apiVersion: batch/v1
kind: Job

metadata:
  name: jmeter-job

spec:
  completions: 2
  parallelism: 2

  template:
    metadata:
      labels:
        app: jmeter

    spec:
      containers:
        - name: jmeter
          image: 060119698736.dkr.ecr.ap-south-1.amazonaws.com/terraform-demo:v1
          imagePullPolicy: Always

      restartPolicy: Never
