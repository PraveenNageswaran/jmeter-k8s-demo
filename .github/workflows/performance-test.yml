name: Run JMeter on EKS

on:
workflow_dispatch:

jobs:
run-jmeter:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: YOUR_ACCESS_KEY
      aws-secret-access-key: YOUR_SECRET_KEY
      aws-region: ap-south-1

  - name: Login to Amazon ECR
    uses: aws-actions/amazon-ecr-login@v2

  - name: Build Docker Image
    run: |
      docker build -t terraform-demo:v1 .

  - name: Tag Docker Image
    run: |
      docker tag terraform-demo:v1 060119698736.dkr.ecr.ap-south-1.amazonaws.com/terraform-demo:v1

  - name: Push Docker Image
    run: |
      docker push 060119698736.dkr.ecr.ap-south-1.amazonaws.com/terraform-demo:v1

  - name: Configure kubectl
    run: |
      aws eks update-kubeconfig --region ap-south-1 --name praveen-eks-cluster

  - name: Delete Existing Job
    run: |
      kubectl delete job jmeter-job --ignore-not-found=true

  - name: Deploy JMeter Job
    run: |
      kubectl apply -f job.yml

  - name: Verify Deployment
    run: |
      kubectl get jobs
      kubectl get pods
```
